[project]
name = "ai-coding-toolkit"
version = "0.1.0"
description = "Starter kit for AI-assisted coding with tools"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.scripts]
ai-code = "ai_coding_toolkit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]